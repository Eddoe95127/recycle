<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>收購後台｜iPhone收購中心</title>
<link rel="stylesheet" href="style.css?v=20261120b">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  body { background: #f2f2f4; }
  .wrap { max-width: 1280px; }
  .nav .tag { font-size: 12px; font-weight: 600; background: var(--ink); color: #fff; padding: 2px 8px; border-radius: 6px; margin-left: 4px; }
  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
  .nav .logo { white-space: nowrap; }
  @media (max-width: 560px) { #who, .nav .logo #shopName { display: none; } }
  .stats { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; margin: 22px 0 18px; }
  @media (max-width: 1100px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 640px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: #fff; border: 0; border-radius: 16px; padding: 14px 16px; text-align: left; box-shadow: var(--shadow); color: var(--ink); position: relative; overflow: hidden; transition: transform .15s; }
  .stat:hover { transform: translateY(-2px); }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
  .stat .n { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .stat .l { font-size: 13px; color: var(--muted); }
  .stat.hot .n { color: var(--c); }
  .stat.on { box-shadow: 0 0 0 2px var(--c), var(--shadow); }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .toolbar .input { max-width: 320px; padding: 10px 14px; border-radius: 999px; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .tabs button { border: 0; background: #fff; border-radius: 999px; padding: 7px 14px; font-size: 13px; white-space: nowrap; color: var(--ink-2); box-shadow: var(--shadow); }
  .tabs button.on { background: var(--ink); color: #fff; }
  .tabs button i { font-style: normal; opacity: .6; margin-left: 4px; }
  .table { width: 100%; border-collapse: separate; border-spacing: 0; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); font-size: 14px; }
  .table th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 12px 14px; background: #fafafa; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .table td { padding: 13px 14px; border-bottom: 1px solid #f0f0f2; vertical-align: top; }
  .table tr:last-child td { border-bottom: 0; }
  .table tbody tr { cursor: pointer; transition: background .1s; }
  .table tbody tr:hover { background: #f8f8fa; }
  .table tbody tr.sel { background: #eef5ff; }
  .table .sub { color: var(--muted); font-size: 12px; }
  .num { font-variant-numeric: tabular-nums; }
  @media (max-width: 760px) {
    .table thead { display: none; }
    .table, .table tbody, .table tr, .table td { display: block; }
    .table tr { padding: 12px 14px; border-bottom: 1px solid #f0f0f2; }
    .table td { padding: 2px 0; border: 0; }
    .table td.hide-m { display: none; }
  }
  /* drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--bg); z-index: 50; transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.12); }
  .drawer.show { transform: none; }
  .d-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; background: #fff; border-bottom: 1px solid var(--line); }
  .d-head b { font-size: 18px; flex: 1; }
  .d-close { border: 0; background: #f2f2f4; width: 32px; height: 32px; border-radius: 50%; font-size: 18px; color: var(--ink-2); }
  .d-body { flex: 1; overflow-y: auto; padding: 16px 16px 24px; }
  .d-body .card { padding: 18px; border-radius: 16px; margin-bottom: 12px; }
  .d-body h3 { font-size: 14px; margin: 0 0 12px; color: var(--ink-2); display: flex; justify-content: space-between; align-items: center; }
  .d-foot { padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  .copy { border: 0; background: #f2f2f4; border-radius: 6px; font-size: 12px; padding: 2px 8px; margin-left: 6px; color: var(--ink-2); }
  .next-btn { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 0; border-radius: 14px; padding: 14px 16px; color: #fff; background: var(--c); font-weight: 700; font-size: 16px; }
  .next-btn small { font-weight: 500; opacity: .85; font-size: 12px; }
  .row-actions { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .row-actions select { flex: 1; min-width: 160px; }
  .alert { background: #fff4e5; color: #8a5300; border-radius: 12px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; }
  .gate { max-width: 460px; margin: 80px auto; }
  .id-thumb { width: 100%; max-width: 280px; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: #eceef1; min-height: 60px; display: block; }
  /* 檢測報告編輯器 */
  .rep-ed { position: fixed; inset: 0; z-index: 60; background: var(--bg); display: none; flex-direction: column; }
  .rep-ed.show { display: flex; }
  .rep-ed .d-head { gap: 10px; }
  .rep-ed-body { flex: 1; overflow-y: auto; padding: 16px; max-width: 820px; width: 100%; margin: 0 auto; }
  .rep-ed .d-foot { max-width: none; }
  .rep-ed .card { padding: 18px; }
  .ck-row { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 8px 0; border-top: 1px solid #f0f0f2; }
  .ck-row .ck-note { grid-column: 1 / -1; padding: 7px 10px; font-size: 14px; display: none; }
  .ck-row.bad .ck-note, .ck-row .ck-note:not(:placeholder-shown) { display: block; }
  .ck-row.bad .ck-lbl { color: var(--red); font-weight: 600; }
  .ck-lbl { font-size: 14px; }
  .seg { display: inline-flex; background: #f2f2f4; border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--ink-2); }
  .seg button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 700; }
  .ck-row.ok .seg button.on { color: #1f9d55; } .ck-row.bad .seg button.on { color: #e5484d; } .ck-row.na .seg button.on { color: #8e8e93; }
  .ph-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .ph { position: relative; }
  .ph img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 10px; background: #eceef1; display: block; cursor: zoom-in; }
  .ph .input { margin-top: 6px; padding: 7px 10px; font-size: 13px; }
  .ph-del { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 13px; }
  .ph-del.static { position: static; background: #f2f2f4; color: var(--ink-2); flex: none; }
  .ph-add { display: grid; place-items: center; aspect-ratio: 4/3; border: 2px dashed var(--line-2); border-radius: 10px; color: var(--ink-2); font-weight: 600; cursor: pointer; }
  .ph-add:hover { border-color: var(--ink); }
  .price-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .price-row > span { flex: 1; font-size: 14px; }
  .price-row .input { padding: 9px 12px; }
  .price-row .num { max-width: 140px; text-align: right; }
  .price-row.minus .input:first-child { flex: 1; }
  .price-row.sub { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 6px; }
  .price-row.sub b { font-size: 18px; }
  .lightbox.prev { cursor: default; justify-content: flex-start; overflow-y: auto; padding: 24px 12px; }
  .prev-box { max-width: 640px; width: 100%; }
  .uid { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #f2f2f4; padding: 10px 12px; border-radius: 10px; word-break: break-all; margin: 12px 0; }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="logo" href="admin.html"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.6"/><path d="M10.5 5h3"/></svg></span><span id="shopName">iPhone收購中心</span><span class="tag">後台</span></a>
    <div class="nav-right"><span id="who"></span><button class="btn btn-ghost btn-sm" id="refresh" hidden>重新整理</button><button class="link" id="logout" hidden onclick="logout()">登出</button></div>
  </div>
</header>
<main class="wrap" id="app"><div class="spinner"></div></main>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<script src="config.js?v=20261120b"></script>
<script src="shared.js?v=20261120b"></script>
<script>
const app = $('#app');
let orders = [];
let filter = 'active';
let query = '';
let openId = null;

const CLOSED = ['已付款', '已退回', '已取消'];
const GROUPS = [
  { key: 'g-new', label: '待安排取件', color: '#0A84FF', match: o => o.status === '已預約' },
  { key: 'g-ship', label: '物流中', color: '#5E5CE6', match: o => ['已安排取件', '已取件'].includes(o.status) },
  { key: 'g-check', label: '檢測中', color: '#BF5AF2', match: o => o.status === '檢測中' },
  { key: 'g-quote', label: '待客戶確認', color: '#FF9F0A', match: o => o.status === '已報價' },
  { key: 'g-pay', label: '待匯款', color: '#30D158', match: o => o.status === '客戶同意', hot: true },
  { key: 'g-return', label: '待寄回', color: '#8E8E93', match: o => ['客戶不同意', '退回寄送中'].includes(o.status), hot: true },
  { key: 'g-done', label: '本月成交', color: '#1d1d1f', match: o => o.status === '已付款' && (o.updatedAt || '').slice(0, 7) === thisMonth() },
];
const thisMonth = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

/* ============================== 進入 ============================== */
(async function init() {
  $('#shopName').textContent = CFG.SHOP_NAME;
  try { await initLine(); } catch (e) { app.innerHTML = `<div class="card gate empty">LINE 初始化失敗：${esc(e.message)}</div>`; return; }
  start();
})();

async function start() {
  if (!isLoggedIn()) {
    mountLogin(app, { title: '收購後台', sub: '請用管理者帳號登入（LINE、Google 或 Email 驗證碼）', lineParams: MOCK ? { mock: 1 } : {}, onDone: start });
    return;
  }
  app.innerHTML = '<div class="spinner"></div>';
  try {
    const me = await api('adminWhoami');
    if (!me.isAdmin) {
      const key = me.via === 'LINE' ? 'ADMIN_LINE_IDS' : 'ADMIN_EMAIL';
      app.innerHTML = `<div class="card gate"><h2 class="card-title">尚未開通後台權限</h2>
        <p class="muted">${esc(me.name)} 您好，請把下面這個${me.via === 'LINE' ? ' LINE ID' : ' Email'} 加到 Apps Script「指令碼屬性」的 <b>${key}</b>（多個用逗號分隔），再重新整理此頁。</p>
        <div class="uid">${esc(me.userId)}</div>
        <button class="btn btn-dark btn-sm" id="cp">複製</button> <button class="btn btn-ghost btn-sm" onclick="logout()">換帳號登入</button></div>`;
      $('#cp').onclick = () => navigator.clipboard?.writeText(me.userId).then(() => toast('已複製'));
      return;
    }
    $('#who').textContent = me.name;
    $('#refresh').hidden = false;
    $('#refresh').onclick = () => load(true);
    $('#logout').hidden = false;
    await load();
  } catch (e) {
    if (e.auth) return start();
    app.innerHTML = `<div class="card gate empty">${esc(e.message)}</div>`;
  }
}

async function load(keepOpen) {
  if (!orders.length) app.innerHTML = '<div class="spinner"></div>';
  try {
    orders = (await api('adminList')).orders;
    renderBoard();
    if (keepOpen && openId) openDrawer(openId);
    if (keepOpen) toast('已更新');
  } catch (e) { if (e.auth) return start(); toast(e.message); }
}

/* ============================== 列表 ============================== */
function visible() {
  const q = query.trim().toLowerCase();
  return orders.filter(o => {
    if (filter === 'active' && CLOSED.includes(o.status)) return false;
    if (filter === 'closed' && !CLOSED.includes(o.status)) return false;
    if (filter.startsWith('g-') && !GROUPS.find(g => g.key === filter).match(o)) return false;
    if (STATUS_LIST.includes(filter) && o.status !== filter) return false;
    if (!q) return true;
    return [o.id, o.name, o.phone, o.email, o.tracking, o.itemsText, o.address].join(' ').toLowerCase().includes(q);
  });
}

function renderBoard() {
  const active = orders.filter(o => !CLOSED.includes(o.status)).length;
  app.innerHTML = `
    <div class="stats">${GROUPS.map(g => { const n = orders.filter(g.match).length; return `<button class="stat ${g.hot && n ? 'hot' : ''} ${filter === g.key ? 'on' : ''}" style="--c:${g.color}" data-f="${g.key}"><div class="n num">${n}</div><div class="l">${g.label}</div></button>`; }).join('')}</div>
    <div class="toolbar">
      <input class="input" id="q" placeholder="搜尋 姓名／電話／訂單編號／單號／型號" value="${esc(query)}">
      <div class="tabs">
        <button data-f="active" class="${filter === 'active' ? 'on' : ''}">進行中<i>${active}</i></button>
        <button data-f="all" class="${filter === 'all' ? 'on' : ''}">全部<i>${orders.length}</i></button>
        ${STATUS_LIST.map(s => { const n = orders.filter(o => o.status === s).length; return n ? `<button data-f="${esc(s)}" class="${filter === s ? 'on' : ''}">${esc(s)}<i>${n}</i></button>` : ''; }).join('')}
      </div>
    </div>
    <div id="tbl"></div>`;
  $$('[data-f]').forEach(b => b.onclick = () => { filter = filter === b.dataset.f && b.dataset.f.startsWith('g-') ? 'active' : b.dataset.f; renderBoard(); });
  $('#q').oninput = e => { query = e.target.value; renderTable(); };
  renderTable();
}

function renderTable() {
  const list = visible();
  if (!list.length) { $('#tbl').innerHTML = '<div class="card empty">沒有符合的訂單</div>'; return; }
  $('#tbl').innerHTML = `<table class="table"><thead><tr><th>訂單</th><th>客戶</th><th>商品</th><th>狀態</th><th>報價</th><th>更新</th></tr></thead><tbody>
    ${list.map(o => { const first = o.items[0] || {}; return `<tr data-id="${esc(o.id)}" class="${o.id === openId ? 'sel' : ''}">
      <td><b class="num">${esc(o.id)}</b><div class="sub">${esc(o.createdAt)}</div></td>
      <td>${esc(o.name)}<div class="sub num">${esc(o.phone)}</div></td>
      <td>${esc(itemTitle(first))}${o.items.length > 1 ? ` <span class="sub">+${o.items.length - 1}</span>` : ''}<div class="sub">${esc(first.category || '')}</div></td>
      <td>${badge(o.status)}</td>
      <td class="num hide-m">${o.quote ? 'NT$ ' + money(o.quote) : '<span class="sub">—</span>'}</td>
      <td class="sub num hide-m">${esc((o.updatedAt || '').slice(5))}</td>
    </tr>`; }).join('')}
  </tbody></table>`;
  $$('#tbl tbody tr').forEach(tr => tr.onclick = () => openDrawer(tr.dataset.id));
}

/* ============================== 訂單抽屜 ============================== */
function closeDrawer() { openId = null; $('#drawer').classList.remove('show'); $('#scrim').classList.remove('show'); $$('#tbl tr.sel').forEach(t => t.classList.remove('sel')); }
$('#scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

function openDrawer(id) {
  const o = orders.find(x => x.id === id);
  if (!o) return;
  openId = id;
  $$('#tbl tr').forEach(t => t.classList.toggle('sel', t.dataset.id === id));
  const next = NEXT_STATUS[o.status];
  const shipText = `${o.name}\n${o.phone}\n${o.city}${o.address}`;
  const bankText = o.bankAccount ? `${o.bankName} ${o.bankBranch}\n戶名：${o.bankHolder}\n帳號：${o.bankAccount}` : '';
  const d = $('#drawer');
  d.innerHTML = `
    <div class="d-head"><b class="num">${esc(o.id)}</b>${badge(o.status)}<button class="d-close" aria-label="關閉">✕</button></div>
    <div class="d-body">
      <div class="card">
        ${stepperHTML(o.status)}
        ${next === '已報價'
          ? `<button class="next-btn" id="repNext" style="--c:${statusColor(next)};margin-top:18px"><span>填寫檢測報告並報價</span><small>${o.report ? '繼續編輯' : '開始'} →</small></button>`
          : next ? `<button class="next-btn" id="nextBtn" style="--c:${statusColor(next)};margin-top:18px"><span>改為「${esc(next)}」</span><small>並通知客戶 →</small></button>` : ''}
        <div class="row-actions">
          <select class="input" id="stSel">${STATUS_LIST.map(s => `<option ${s === o.status ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
          <label class="check small"><input type="checkbox" id="notify" checked> 改狀態時通知客戶</label>
        </div>
        ${o.notified ? `<div class="small muted" style="margin-top:8px">上次通知：${esc(o.notified)}</div>` : ''}
      </div>

      <div class="card">
        <h3>檢測估價報告 ${o.report ? `<span class="small" style="font-weight:500">NT$ ${money(o.report.total)}・${o.report.items.reduce((s, it) => s + it.photos.length, 0)} 張照片・${esc(o.report.updatedAt || '')}</span>` : ''}</h3>
        ${['已取件', '檢測中'].includes(o.status) && !o.report ? '<p class="small muted" style="margin:0 0 10px">檢測完成後在這裡填寫報告、上傳照片，送出後客戶會收到含照片的完整報價</p>' : ''}
        <button class="btn ${o.report || !['已取件', '檢測中'].includes(o.status) ? 'btn-ghost' : 'btn-dark'} btn-block" id="repBtn">${o.report ? '查看／編輯檢測報告' : '填寫檢測報告'}</button>
      </div>

      ${o.status === '客戶同意' ? `<div class="alert">💰 客戶已同意 NT$ ${money(o.quote)}，請先核對下方「身分證照片」與「匯款戶名」，匯款後按「改為已付款」。</div>` : ''}
      ${o.status === '客戶不同意' ? '<div class="alert">↩️ 客戶不同意報價，請安排寄回，填寫單號後改為「退回寄送中」。</div>' : ''}

      <div class="card">
        <h3>物流</h3>
        <div class="grid2">
          <label class="field"><span>物流公司</span><input class="input" id="fCarrier" value="${esc(o.carrier)}" list="carriers" placeholder="黑貓宅急便"><datalist id="carriers"><option value="黑貓宅急便"><option value="新竹物流"><option value="中華郵政"><option value="全家二手機回收"></datalist></label>
          <label class="field"><span>託運單號</span><input class="input" id="fTracking" value="${esc(o.tracking)}"></label>
        </div>
        <h3 style="margin-top:4px">檢測報價</h3>
        <label class="field"><span>報價金額（NT$）</span><input class="input num" id="fQuote" value="${esc(o.quote)}" inputmode="numeric" placeholder="例：12500"></label>
        <label class="field"><span>報價說明（客戶看得到）</span><textarea class="input" id="fQuoteNote" placeholder="例：電池健康度 86%，背蓋輕微刮傷">${esc(o.quoteNote)}</textarea></label>
        <label class="field" style="margin-bottom:0"><span>內部備註（客戶看不到）</span><textarea class="input" id="fInternal">${esc(o.internal)}</textarea></label>
      </div>

      <div class="card">
        <h3>客戶資料 <button class="copy" data-copy="${esc(shipText)}">複製寄件資訊</button></h3>
        <dl class="kv">
          <dt>姓名</dt><dd>${esc(o.name)}　<span class="muted small">LINE：${esc(o.lineName)}</span></dd>
          <dt>手機</dt><dd><a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><button class="copy" data-copy="${esc(o.phone)}">複製</button></dd>
          <dt>Email</dt><dd><a href="mailto:${esc(o.email)}">${esc(o.email)}</a></dd>
          <dt>身分證</dt><dd class="num">${o.idNo ? esc(o.idNo) : '<span class="muted small">客戶同意報價時提供</span>'}</dd>
          ${o.idPhoto ? `<dt>身分證照片</dt><dd><img class="id-thumb" data-photo="${esc(o.idPhoto)}" alt="身分證正面"></dd>` : ''}
          <dt>地址</dt><dd>${esc(o.city)}${esc(o.address)}<button class="copy" data-copy="${esc(o.city + o.address)}">複製</button></dd>
          <dt>收件時段</dt><dd>${esc(o.slot)}</dd>
          ${o.note ? `<dt>客戶備註</dt><dd>${esc(o.note)}</dd>` : ''}
        </dl>
      </div>

      <div class="card">
        <h3>匯款帳戶 ${bankText ? `<button class="copy" data-copy="${esc(bankText)}">複製</button>` : ''}</h3>
        ${o.bankAccount ? `<dl class="kv"><dt>銀行</dt><dd>${esc(o.bankName)} ${esc(o.bankBranch)}</dd><dt>戶名</dt><dd>${esc(o.bankHolder)}${o.bankHolder && o.bankHolder !== o.name ? ' <span style="color:var(--red)" class="small">⚠ 與回收者姓名不同</span>' : ''}</dd><dt>帳號</dt><dd class="num">${esc(o.bankAccount)}<button class="copy" data-copy="${esc(o.bankAccount)}">複製</button></dd></dl>` : '<p class="muted small" style="margin:0">客戶尚未填寫（同意報價時會要求填寫）</p>'}
      </div>

      <div class="card">
        <h3>回收商品（${o.items.length}）</h3>
        ${o.items.map((it, i) => `<div style="padding:10px 0;border-top:${i ? '1px solid var(--line)' : '0'}"><b>${i + 1}. ${esc(it.category)}・${esc(itemTitle(it))}</b><div class="small muted">${esc(itemSummary(it))}</div></div>`).join('') || `<div class="small" style="white-space:pre-line">${esc(o.itemsText)}</div>`}
      </div>

      <div class="card">
        <h3>狀態紀錄</h3>
        <ul class="timeline" style="--c:${statusColor(o.status)}">${[...o.history].reverse().map(h => `<li><b>${esc(h.status)}</b><time>${esc(h.time)}</time></li>`).join('')}</ul>
      </div>
    </div>
    <div class="d-foot"><span class="err" id="dErr" style="flex:1;margin:0"></span><button class="btn btn-dark" id="save">儲存</button></div>`;
  d.classList.add('show'); $('#scrim').classList.add('show');
  $('.d-close', d).onclick = closeDrawer;
  $$('[data-copy]', d).forEach(b => b.onclick = () => navigator.clipboard?.writeText(b.dataset.copy).then(() => toast('已複製'), () => {}));
  loadPhotos(d);
  $('#save').onclick = () => save(o, $('#stSel').value);
  $('#repBtn').onclick = () => openReport(o);
  if ($('#repNext')) $('#repNext').onclick = () => openReport(o);
  if ($('#nextBtn')) $('#nextBtn').onclick = () => save(o, next);
}

/* ============================== 檢測報告編輯 ============================== */
let rep = null, repOrder = null;

function newReport(o) {
  return {
    summary: '',
    items: (o.items.length ? o.items : [{ category: '其他', name: '商品' }]).map(it => ({
      title: it.category === '其他' ? (it.name || '其他商品') : itemTitle(it),
      grade: '', battery: '', base: '', deductions: [], photos: [],
      checks: CHECK_ITEMS.map(c => ({ k: c.k, label: c.label, r: 'ok', note: '' })),
    })),
  };
}

function openReport(o) {
  repOrder = o;
  rep = o.report ? JSON.parse(JSON.stringify(o.report)) : newReport(o);
  let ed = $('#repEd');
  if (!ed) { ed = document.createElement('div'); ed.id = 'repEd'; ed.className = 'rep-ed'; document.body.appendChild(ed); }
  drawReport();
  ed.classList.add('show');
}
function closeReport() { $('#repEd').classList.remove('show'); }

function drawReport() {
  const o = repOrder, ed = $('#repEd');
  const keep = $('.rep-ed-body', ed)?.scrollTop || 0;
  computeReport(rep);
  const canSubmit = ['已取件', '檢測中', '已報價'].includes(o.status);
  ed.innerHTML = `
    <div class="d-head"><b>檢測報告・${esc(o.id)}</b><button class="btn btn-ghost btn-sm" id="rePrev">客戶看到的樣子</button><button class="d-close" id="reClose" aria-label="關閉">✕</button></div>
    <div class="rep-ed-body">
      <datalist id="dedList">${DEDUCT_SUGGEST.map(s => `<option value="${esc(s)}">`).join('')}</datalist>
      ${rep.items.map((it, i) => `<div class="card" data-i="${i}">
        <label class="field"><span>商品 ${rep.items.length > 1 ? i + 1 : ''}</span><input class="input" data-f="title" value="${esc(it.title)}"></label>
        <div class="grid2">
          <div class="field"><span>外觀等級</span><div class="chips">${['A', 'B', 'C', 'D'].map(g => `<label class="chip" title="${GRADE_TEXT[g]}"><input type="radio" name="g${i}" data-grade value="${g}" ${it.grade === g ? 'checked' : ''}><span>${g} ${GRADE_TEXT[g]}</span></label>`).join('')}</div></div>
          <label class="field"><span>電池健康度（%）</span><input class="input" data-f="battery" inputmode="numeric" maxlength="3" value="${esc(it.battery)}" placeholder="例：86"></label>
        </div>

        <div class="field"><span>照片 <small class="muted" style="font-weight:400">外觀刮傷、異常處、電池健康度截圖等，可多選</small></span>
          <div class="ph-grid">
            ${it.photos.map((p, j) => `<div class="ph"><img data-photo="${esc(p.id)}" alt="${esc(p.caption)}"><button class="ph-del" data-delph="${j}" aria-label="刪除">✕</button>
              <input class="input" data-cap="${j}" value="${esc(p.caption)}" placeholder="照片說明"></div>`).join('')}
            <label class="ph-add">＋ 加照片<input type="file" accept="image/*" multiple hidden data-upload></label>
          </div>
        </div>

        <div class="field"><span style="display:flex;justify-content:space-between">檢測項目 <button type="button" class="link" data-allok style="font-size:13px;padding:0">全部設為正常</button></span>
          ${it.checks.map((c, j) => `<div class="ck-row ${c.r}">
            <div class="ck-lbl">${esc(c.label)}</div>
            <div class="seg">${['ok', 'bad', 'na'].map(r => `<button type="button" class="${c.r === r ? 'on' : ''}" data-ck="${j}" data-r="${r}">${RES[r][0]}</button>`).join('')}</div>
            <input class="input ck-note" data-note="${j}" value="${esc(c.note)}" placeholder="${c.k === 'water' ? '例：泡水指示貼片正常（白色）' : '說明（選填）'}">
          </div>`).join('')}
        </div>

        <div class="field"><span>估價</span>
          <div class="price-row"><span>基本收購價</span><input class="input num" data-f="base" inputmode="numeric" value="${esc(it.base)}" placeholder="例：13800"></div>
          ${it.deductions.map((d, j) => `<div class="price-row minus"><input class="input" list="dedList" data-dr="${j}" value="${esc(d.reason)}" placeholder="扣減原因">
            <input class="input num" data-da="${j}" inputmode="numeric" value="${esc(d.amount)}" placeholder="金額"><button type="button" class="ph-del static" data-deld="${j}" aria-label="刪除">✕</button></div>`).join('')}
          <button type="button" class="link" data-addd>＋ 新增扣減項目</button>
          <div class="price-row sub"><span>小計</span><b class="num" data-subtotal>NT$ ${money(it.subtotal)}</b></div>
        </div>
      </div>`).join('')}
      <div class="card">
        <label class="field"><span>給客戶的檢測說明</span><textarea class="input" data-summary placeholder="例：整體功能正常，外觀有輕微使用痕跡；電池健康度略低於同型號平均。">${esc(rep.summary)}</textarea></label>
        <div class="rep-total"><span>檢測後回收價</span><b id="reTotal">NT$ ${money(rep.total)}</b></div>
      </div>
    </div>
    <div class="d-foot"><span class="err" id="reErr" style="flex:1;margin:0"></span>
      <button class="btn btn-ghost" id="reSave">儲存草稿</button>
      ${canSubmit ? `<button class="btn btn-dark" id="reSubmit">${o.status === '已報價' ? '更新並重寄報價' : '送出報價給客戶'}</button>` : ''}
    </div>`;
  $('.rep-ed-body', ed).scrollTop = keep;
  loadPhotos(ed);
  $('#reClose').onclick = closeReport;
  $('#rePrev').onclick = () => { computeReport(rep); const w = document.createElement('div'); w.className = 'lightbox prev'; w.innerHTML = `<div class="prev-box">${reportHTML({ ...rep, updatedAt: '（預覽）' })}<button class="btn btn-dark btn-block" style="margin-top:12px">關閉預覽</button></div>`; w.onclick = e => { if (e.target === w || e.target.tagName === 'BUTTON') w.remove(); }; document.body.appendChild(w); loadPhotos(w); };
  $('#reSave').onclick = () => saveReport(false);
  if ($('#reSubmit')) $('#reSubmit').onclick = () => saveReport(true);
}

function itemOf(el) { return rep.items[+el.closest('[data-i]').dataset.i]; }
function refreshTotals() {
  computeReport(rep);
  $$('#repEd [data-i]').forEach(card => { const it = rep.items[+card.dataset.i]; $('[data-subtotal]', card).textContent = 'NT$ ' + money(it.subtotal); });
  $('#reTotal').textContent = 'NT$ ' + money(rep.total);
}
document.addEventListener('input', e => {
  const t = e.target;
  if (!t.closest('#repEd')) return;
  if (t.matches('[data-summary]')) { rep.summary = t.value; return; }
  if (!t.closest('[data-i]')) return;
  const it = itemOf(t);
  if (t.dataset.f) { it[t.dataset.f] = t.value; if (t.dataset.f === 'base') refreshTotals(); }
  else if (t.dataset.note !== undefined) it.checks[+t.dataset.note].note = t.value;
  else if (t.dataset.cap !== undefined) it.photos[+t.dataset.cap].caption = t.value;
  else if (t.dataset.dr !== undefined) it.deductions[+t.dataset.dr].reason = t.value;
  else if (t.dataset.da !== undefined) { it.deductions[+t.dataset.da].amount = t.value; refreshTotals(); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (!t.closest('#repEd') || !t.closest('[data-i]')) return;
  const it = itemOf(t);
  if (t.matches('[data-grade]')) { it.grade = t.value; return; }
  if (t.matches('[data-upload]')) {
    const files = [...t.files];
    if (it.photos.length + files.length > 12) { toast('每件商品最多 12 張照片'); return; }
    $('#reErr').textContent = `上傳中 0 / ${files.length}…`;
    let done = 0;
    for (const f of files) {
      try {
        const dataUrl = await resizeImage(f);
        const r = await api('adminUploadPhoto', { id: repOrder.id, dataUrl });
        photoCache[r.fileId] = dataUrl;
        it.photos.push({ id: r.fileId, caption: '' });
        $('#reErr').textContent = `上傳中 ${++done} / ${files.length}…`;
      } catch (err) { toast(err.message); }
    }
    $('#reErr').textContent = done ? '照片已上傳，記得按「儲存」' : '';
    drawReport();
  }
});
document.addEventListener('click', async e => {
  const t = e.target;
  if (!t.closest('#repEd') || !t.closest('[data-i]')) return;
  const it = itemOf(t);
  if (t.dataset.ck !== undefined) { it.checks[+t.dataset.ck].r = t.dataset.r; const row = t.closest('.ck-row'); row.className = 'ck-row ' + t.dataset.r; $$('button', row).forEach(b => b.classList.toggle('on', b === t)); }
  else if (t.matches('[data-allok]')) { it.checks.forEach(c => c.r = 'ok'); drawReport(); }
  else if (t.dataset.delph !== undefined) { if (!(await ask('刪除這張照片？', '刪除'))) return; const [p] = it.photos.splice(+t.dataset.delph, 1); api('adminDeletePhoto', { fileId: p.id }).catch(() => {}); drawReport(); }
  else if (t.matches('[data-addd]')) { it.deductions.push({ reason: '', amount: '' }); drawReport(); $$(`#repEd [data-i="${rep.items.indexOf(it)}"] [data-dr]`).pop()?.focus(); }
  else if (t.dataset.deld !== undefined) { it.deductions.splice(+t.dataset.deld, 1); drawReport(); }
});

async function saveReport(submit) {
  computeReport(rep);
  if (submit) {
    if (!rep.total) { $('#reErr').textContent = '請先填寫基本收購價'; return; }
    const photos = rep.items.reduce((s, it) => s + it.photos.length, 0);
    if (!(await ask(`送出檢測報告給客戶？\n\n回收價：NT$ ${money(rep.total)}\n照片：${photos} 張\n\n客戶會收到含照片的檢測估價報告 Email，並可在網站上同意或不同意。`, '送出'))) return;
  }
  const btns = $$('#reSave, #reSubmit'); btns.forEach(b => b.disabled = true);
  try {
    const r = await api('adminSaveReport', { id: repOrder.id, report: rep, submit });
    orders[orders.findIndex(x => x.id === repOrder.id)] = r.order;
    toast(submit ? '已送出報價，客戶會收到檢測報告' : '已儲存');
    closeReport();
    renderBoard();
    openDrawer(repOrder.id);
  } catch (e) {
    if (e.auth) { closeReport(); return start(); }
    $('#reErr').textContent = e.message; btns.forEach(b => b.disabled = false);
  }
}

async function save(o, status) {
  const fields = {
    carrier: $('#fCarrier').value.trim(), tracking: $('#fTracking').value.trim(),
    quote: $('#fQuote').value.replace(/[^\d]/g, ''), quoteNote: $('#fQuoteNote').value.trim(), internal: $('#fInternal').value.trim(),
  };
  if (status && status !== o.status) fields.status = status;
  if (fields.status === '已報價' && !fields.quote) { $('#dErr').textContent = '請先填寫報價金額'; $('#fQuote').focus(); return; }
  if (fields.status && !(await ask(`將 ${o.id} 改為「${fields.status}」${$('#notify').checked ? '並通知客戶' : '（不通知客戶）'}？`))) return;
  const btns = $$('#save, #nextBtn'); btns.forEach(b => b.disabled = true);
  try {
    const r = await api('adminUpdate', { id: o.id, fields, notify: $('#notify').checked });
    const i = orders.findIndex(x => x.id === o.id);
    orders[i] = r.order;
    toast(fields.status ? `已改為「${fields.status}」${r.order.notified ? '（' + r.order.notified.split('｜')[1] + '）' : ''}` : '已儲存');
    renderBoard();
    openDrawer(o.id);
  } catch (e) {
    if (e.auth) { closeDrawer(); return start(); }
    $('#dErr').textContent = e.message; btns.forEach(b => b.disabled = false);
  }
}
</script>
